<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Saint Garage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topo">
      <h1>Calculadora Saint Garage</h1>
    </header>

    <section id="categorias" class="categorias" aria-label="Categorias de produtos"></section>

    <footer class="resumo">
      <div class="acoes-resumo">
        <label class="token-box">
          <span>Token</span>
          <input id="tokenParceiro" type="text" maxlength="4" placeholder="TOKEN" autocomplete="off" />
          <small id="tokenStatus"></small>
        </label>

        <div class="botoes-resumo">
          <button id="gerenciar" class="botao-secundario" type="button">GERENCIAR</button>
          <button id="resetar" class="resetar" type="button">RESETAR</button>
        </div>
      </div>

      <label class="tunagem">
        <span>Tunagem e Customização</span>
        <input id="tunagemCustomizacao" type="number" min="0" step="0.01" placeholder="R$ 0,00" />
      </label>

      <div class="total-linha">
        <small id="descontoAplicado" class="desconto-aplicado" hidden></small>
        <span>Valor total:</span>
        <strong id="valorTotal">R$ 0,00</strong>
      </div>
    </footer>

    <div id="gerenciarModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="gerenciarTitulo">
      <div class="modal-painel">
        <div class="modal-topo">
          <h2 id="gerenciarTitulo">Gerenciar tokens</h2>
          <button id="fecharGerenciar" class="botao-fechar" type="button">FECHAR</button>
        </div>

        <div class="tabela-wrap">
          <table class="tabela-tokens">
            <thead>
              <tr>
                <th>Estabelecimento</th>
                <th>Usos</th>
                <th>Token</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listaTokens"></tbody>
          </table>
        </div>

        <div class="novo-token">
          <label>
            <span>Novo estabelecimento</span>
            <input id="novoEstabelecimento" type="text" placeholder="Nome" />
          </label>
          <label>
            <span>Token</span>
            <input id="novoToken" type="text" placeholder="Token" />
          </label>
          <button id="adicionarToken" class="botao-secundario" type="button">ADICIONAR</button>
        </div>

        <p id="gerenciarFeedback" class="gerenciar-feedback"></p>
      </div>
    </div>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
